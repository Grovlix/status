# Change these first
owner: Grovlix # Your GitHub organization or username, where this repository lives
repo: status # The name of this repository

sites:
  - name: Website
    url: https://www.grovlix.com
  - name: Engage
    url: https://engage.grovlix.com
  - name: Automations
    url: https://n8n.grovlix.com
  - name: PopupSnap
    url: https://popupsnap.com

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.grovlix.com
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Grovlix
  introTitle: "**Grovlix** builds apps that help online stores grow."
  introMessage: Live status for Grovlix products and services, monitored in real time. No server required - just GitHub Actions and Upptime.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
